<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>rcell 뷰어</title>
<meta name="description" content="한컴 셀(.cell) 파일을 설치 없이 브라우저에서 여는 오픈소스 뷰어 — by yoomin53">
<meta name="author" content="yoomin53">
<style>
:root{--bg:#f6f7f9;--fg:#1d2329;--muted:#5f6b76;--line:#d6dbe0;--accent:#1f7a5c;--card:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#15181b;--fg:#e6e9ec;--muted:#9aa5b0;--line:#2c3238;--accent:#4cc39a;--card:#1d2125}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,'맑은 고딕','Malgun Gothic',sans-serif}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line);background:var(--card)}
h1{font-size:18px;margin:0}
h1 small{font-weight:normal;color:var(--muted);font-size:13px;margin-left:6px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
button,.pick{font:inherit;font-size:14px;padding:7px 12px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer}
.pick{background:var(--accent);border-color:var(--accent);color:#fff}
button:disabled{opacity:.45;cursor:default}
main{padding:16px}
#drop{border:2px dashed var(--line);border-radius:10px;padding:48px 16px;text-align:center;color:var(--muted);line-height:1.7}
#drop.over{border-color:var(--accent);color:var(--accent)}
#status{color:var(--muted);font-size:13px;margin:8px 0;min-height:1.2em}
#status.err{color:#c0392b}
#view{color:#000}
footer{padding:12px 16px;color:var(--muted);font-size:12px;border-top:1px solid var(--line);line-height:1.6}
footer a{color:var(--accent)}
</style>
<style id="rc-css"></style>
</head>
<body>
<header>
  <h1>rcell 뷰어<small>한컴 셀(.cell) 파일을 브라우저에서</small></h1>
  <div class="actions">
    <label class="pick">파일 열기<input id="file" type="file" accept=".cell,.xlsx,.xlsb" hidden></label>
    <button id="save-cell" disabled>최신 .cell 로 저장</button>
    <button id="save-xlsx" disabled>.xlsx 로 저장</button>
  </div>
</header>
<main>
  <div id="drop">여기에 .cell 파일을 끌어 놓으세요. XML·바이너리·한셀 2010 이하 레거시 형식을 모두 엽니다.<br>파일은 브라우저 밖으로 전송되지 않습니다.</div>
  <div id="status" role="status"></div>
  <div id="view"></div>
</main>
<footer>
  rcell — 한컴 셀 포맷 클린룸 오픈소스 구현 · 만든 사람 <a href="https://github.com/yoomin53">yoomin53</a> ·
  <a href="https://github.com/yoomin53/rcell">GitHub</a> · Apache-2.0<br>
  한컴, 한셀은 (주)한글과컴퓨터의 상표이며 이 프로젝트는 한컴과 관련이 없습니다.
</footer>
<script src="rcell.js"></script>
</body>
</html>
