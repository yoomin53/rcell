[package]
name = "rcell-wasm"
version = "0.2.0"
edition = "2024"
authors = ["yoomin53 (https://github.com/yoomin53)"]
description = "rcell WebAssembly bindings (C ABI, no wasm-bindgen) for the browser viewer"
